[project]
name = "mizan-api"
version = "0.1.0"
description = "Mizan HTTP API gateway."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "groq>=0.30",
    "mizan-agents",
    "mizan-contracts",
    "httpx>=0.28",
    "mizan-core",
    "mizan-evals",
    "mizan-graph",
    "mizan-ingestion",
    "mizan-retrieval",
    "neo4j>=5.26",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "redis>=5.2",
    "temporalio>=1.35.0",
    "uvicorn[standard]>=0.32",
    "pyjwt>=2.10",
    "python-multipart>=0.0.20",
]

[project.scripts]
mizan-agent-worker = "mizan_api.agent_worker:main"
mizan-token = "mizan_api.auth:main"

[tool.uv.sources]
mizan-agents = { workspace = true }
mizan-contracts = { workspace = true }
mizan-core = { workspace = true }
mizan-evals = { workspace = true }
mizan-graph = { workspace = true }
mizan-ingestion = { workspace = true }
mizan-retrieval = { workspace = true }
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_api"]
