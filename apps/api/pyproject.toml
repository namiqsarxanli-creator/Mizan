[project]
name = "mizan-api"
version = "0.1.0"
description = "Mizan HTTP API gateway."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "mizan-core",
    "neo4j>=5.26",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
mizan-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_api"]
