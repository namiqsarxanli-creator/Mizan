[project]
name = "mizan-mcp"
version = "0.1.0"
description = "Mizan as an MCP server: Azerbaijani labour law tools for Claude Desktop and other agents."
requires-python = ">=3.12"
# Deliberately thin: the server is a client of the Mizan HTTP API, so it carries no models,
# databases or LLM keys, and inherits the API's tenant budget, rate limits and telemetry.
dependencies = [
    "httpx>=0.27",
    "mcp>=1.9",
]

[project.scripts]
mizan-mcp = "mizan_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_mcp"]
