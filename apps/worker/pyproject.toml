[project]
name = "mizan-worker"
version = "0.1.0"
description = "Background jobs: scheduled ingestion of legal documents."
requires-python = ">=3.12"
dependencies = [
    "arq>=0.26",
    "mizan-core",
    "mizan-ingestion",
]

[tool.uv.sources]
mizan-core = { workspace = true }
mizan-ingestion = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_worker"]
