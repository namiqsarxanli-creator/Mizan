[project]
name = "mizan-contracts"
version = "0.1.0"
description = "Employment-contract analysis: extraction, clause splitting, checks against the Labour Code."
requires-python = ">=3.12"
dependencies = [
    "mizan-core",
    "mizan-ingestion",
    "mizan-retrieval",
    "pillow>=11.0",
    "pypdf>=5.1",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
]

[tool.uv.sources]
mizan-core = { workspace = true }
mizan-ingestion = { workspace = true }
mizan-retrieval = { workspace = true }
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_contracts"]
