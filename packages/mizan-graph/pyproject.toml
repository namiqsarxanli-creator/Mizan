[project]
name = "mizan-graph"
version = "0.1.0"
description = "Knowledge graph of legal provisions: citations, amendments, court decisions."
requires-python = ">=3.12"
dependencies = [
    "mizan-core",
    "mizan-ingestion",
    "mizan-retrieval",
    "neo4j>=5.26",
]

[project.scripts]
mizan-graph = "mizan_graph.cli:main"

[tool.uv.sources]
mizan-core = { workspace = true }
mizan-ingestion = { workspace = true }
mizan-retrieval = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_graph"]
