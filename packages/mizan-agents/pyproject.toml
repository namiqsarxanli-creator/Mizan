[project]
name = "mizan-agents"
version = "0.1.0"
description = "Multi-agent legal research: planner, researchers, drafter, verifier, judge."
requires-python = ">=3.12"
dependencies = [
    "mizan-core",
    "mizan-graph",
    "mizan-retrieval",
    "pydantic>=2.9",
    "temporalio>=1.35.0",
]

[tool.uv.sources]
mizan-core = { workspace = true }
mizan-graph = { workspace = true }
mizan-retrieval = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_agents"]
