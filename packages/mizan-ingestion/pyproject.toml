[project]
name = "mizan-ingestion"
version = "0.1.0"
description = "Fetch, parse, version and store Azerbaijani legal texts."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "arq>=0.26",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "lxml>=5.3",
    "mizan-core",
    "sqlalchemy[asyncio]>=2.0.36",
]

[project.scripts]
mizan-ingest = "mizan_ingestion.cli:main"

[tool.uv.sources]
mizan-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_ingestion"]
