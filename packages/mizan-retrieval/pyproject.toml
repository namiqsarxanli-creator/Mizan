[project]
name = "mizan-retrieval"
version = "0.1.0"
description = "Hybrid (dense + BM25) temporal retrieval over legal provisions."
requires-python = ">=3.12"
dependencies = [
    "mizan-core",
    "mizan-ingestion",
    "numpy>=2.1",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.3",
    "torch>=2.5",
    "tzdata>=2026.5",
]

[project.scripts]
mizan-retrieval = "mizan_retrieval.cli:main"

[tool.uv.sources]
mizan-core = { workspace = true }
mizan-ingestion = { workspace = true }
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mizan_retrieval"]
