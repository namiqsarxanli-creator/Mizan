[project]
name = "mizan"
version = "0.1.0"
description = "Agentic, measurable legal research platform for Azerbaijani law."
requires-python = ">=3.12"
dependencies = [
    "mizan-agents",
    "mizan-core",
    "mizan-api",
    "mizan-evals",
    "mizan-graph",
    "mizan-ingestion",
    "mizan-retrieval",
    "mizan-train",
    "mizan-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
mizan-agents = { workspace = true }
mizan-core = { workspace = true }
mizan-api = { workspace = true }
mizan-ingestion = { workspace = true }
mizan-worker = { workspace = true }
mizan-retrieval = { workspace = true }
mizan-evals = { workspace = true }
mizan-graph = { workspace = true }
mizan-train = { workspace = true }
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "coverage[toml]>=7.6",
    "lxml-stubs>=0.5",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "apps/*/src"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # isort
    "B",            # bugbear
    "UP",           # pyupgrade
    "N",            # naming
    "S",            # bandit (security)
    "ASYNC",        # async pitfalls
    "BLE",          # blind except
    "C4",           # comprehensions
    "DTZ",          # naive datetimes
    "PT",           # pytest style
    "RET", "SIM",   # simplifications
    "TID",          # tidy imports
    "RUF",
]
# Azerbaijani text: dotless i is a letter, not a homoglyph attack; legal texts write ranges
# of articles with an en dash ("115–117-ci maddələr").
allowed-confusables = ["ı", "–"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "ASYNC240"]
"**/migrations/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "mizan_agents",
    "mizan_core",
    "mizan_api",
    "mizan_evals",
    "mizan_graph",
    "mizan_ingestion",
    "mizan_retrieval",
    "mizan_train",
    "mizan_worker",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/mizan-agents/src",
    "packages/mizan-core/src",
    "packages/mizan-ingestion/src",
    "packages/mizan-retrieval/src",
    "packages/mizan-evals/src",
    "packages/mizan-train/src",
    "packages/mizan-graph/src",
    "apps/api/src",
    "apps/worker/src",
    # Shared test helpers, imported as top-level modules (see pytest `pythonpath`).
    "packages/mizan-agents/tests",
    "packages/mizan-ingestion/tests",
    "packages/mizan-retrieval/tests",
    "apps/api/tests",
]
explicit_package_bases = true
# Every package's conftest only re-exports the shared fixtures of db_fixtures.py, and two files
# called conftest.py on mypy_path would be one module twice.
exclude = ['(^|/|\\)conftest\.py$']

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
# Shared test helpers (importable as top-level modules from tests).
pythonpath = [
    "packages/mizan-agents/tests",
    "packages/mizan-ingestion/tests",
    "packages/mizan-retrieval/tests",
    "apps/api/tests",
]
addopts = ["--import-mode=importlib", "--strict-markers", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the docker compose stack (MIZAN_INTEGRATION=1)"]
filterwarnings = [
    "error::DeprecationWarning:mizan_.*",
    # In-process Qdrant (unit tests) ignores payload indexes; the server honours them.
    "ignore:Payload indexes have no effect:UserWarning",
]

[tool.coverage.run]
branch = true
source = [
    "mizan_agents",
    "mizan_core",
    "mizan_api",
    "mizan_evals",
    "mizan_graph",
    "mizan_ingestion",
    "mizan_retrieval",
    "mizan_train",
    "mizan_worker",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- torch (CPU-only)
# PyPI's Linux torch wheels bundle ~2.5 GB of CUDA libraries; we run on CPU (dev laptop, CI,
# small containers), so pin torch to the official CPU wheel index everywhere.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
