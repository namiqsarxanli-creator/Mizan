name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  quality:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy packages apps
      # Known vulnerabilities in the locked runtime dependencies (OWASP LLM03). The CPU build
      # of torch is not on PyPI and cannot be audited this way.
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-workspace --no-dev -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term --cov-report=xml
      # Pre-registered prompt-injection gate (evals/results/f10_redteam): no LLM, no services.
      - run: uv run mizan-eval redteam --gate > /dev/null
      # Contract rules still find every planted violation, with no false positive (regression).
      - run: uv run mizan-eval contracts --gate > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  integration:
    name: Integration tests (compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: cp .env.example .env
      - run: docker compose up -d --wait postgres redis qdrant neo4j
      - run: uv sync --frozen
      - run: uv run pytest -m integration
        env:
          MIZAN_INTEGRATION: "1"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  eval-gate:
    name: Retrieval eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [quality, test]
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports: ["16333:6333"]
    env:
      MIZAN_QDRANT__URL: http://127.0.0.1:16333
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # bge-m3 (~2.3 GB): downloaded once, then restored from the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v1
      # Passage embeddings are keyed by the frozen corpus. The cache is content-addressed, so
      # when the corpus changes the previous one is restored and only changed texts are embedded.
      - uses: actions/cache@v4
        with:
          path: data/embeddings
          key: embeddings-bge-m3-${{ hashFiles('evals/snapshots/labour_code.jsonl.gz') }}
          restore-keys: embeddings-bge-m3-
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:16333/readyz && exit 0; sleep 2; done
          exit 1
      - name: Build index from the corpus snapshot
        run: >
          uv run mizan-retrieval index --strategy article --models bge-m3
          --from-snapshot evals/snapshots/labour_code.jsonl.gz
      # The serving path: dense search + citation graph (rebuilt from the snapshot, no Neo4j).
      - name: Compare with the baseline (fails on a significant regression)
        run: uv run mizan-graph gate

  docker:
    name: Build ${{ matrix.app }} image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [quality, test]
    strategy:
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          tags: mizan-${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
