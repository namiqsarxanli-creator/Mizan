# Local development stack.  Usage:  cp .env.example .env && docker compose up -d --build
# Ports are bound to 127.0.0.1 only: nothing here is meant to be reachable from the network.
# Host ports default to an uncommon range (1xxxx) to avoid clashing with other local stacks;
# override them with MIZAN_HOST_PORT_* in .env. Inside the compose network the standard
# ports are used.

name: mizan

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

services:
  postgres:
    restart: unless-stopped
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${MIZAN_POSTGRES__USER:-mizan}
      POSTGRES_PASSWORD: ${MIZAN_POSTGRES__PASSWORD:-mizan-dev-password}
      POSTGRES_DB: ${MIZAN_POSTGRES__DATABASE:-mizan}
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_POSTGRES:-15432}:5432"
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_REDIS:-16379}:6379"
    volumes: [redis-data:/data]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "redis-cli", "ping"]

  qdrant:
    restart: unless-stopped
    image: qdrant/qdrant:v1.19.2
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_QDRANT:-16333}:6333"
      - "127.0.0.1:${MIZAN_HOST_PORT_QDRANT_GRPC:-16334}:6334"
    volumes: [qdrant-data:/qdrant/storage]
    healthcheck:
      <<: *healthcheck
      # The image ships without curl/wget; probe the port with bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]

  neo4j:
    restart: unless-stopped
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${MIZAN_NEO4J__PASSWORD:-mizan-dev-password}
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_NEO4J_HTTP:-17474}:7474"
      - "127.0.0.1:${MIZAN_HOST_PORT_NEO4J_BOLT:-17687}:7687"
    volumes: [neo4j-data:/data]
    healthcheck:
      <<: *healthcheck
      start_period: 30s
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1"]

  # One-off: apply database migrations before anything that needs the schema starts.
  migrate:
    build: &worker-build
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: &env-file
      - path: .env
        required: false
    environment: &container-env
      # Containers log JSON (production parity); host-run code uses the .env setting.
      MIZAN_LOG__JSON_FORMAT: "true"
      MIZAN_POSTGRES__HOST: postgres
      MIZAN_POSTGRES__PORT: "5432"
      MIZAN_REDIS__URL: redis://redis:6379/0
      MIZAN_QDRANT__URL: http://qdrant:6333
      MIZAN_NEO4J__URI: bolt://neo4j:7687
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    restart: unless-stopped
    build: *worker-build
    env_file: *env-file
    environment: *container-env
    volumes: [raw-data:/app/data/raw]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: *env-file
    environment: *container-env
    volumes:
      - model-cache:/app/data/hf
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_API:-18000}:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      neo4j: { condition: service_healthy }

  # ---------------------------------------------------------------- durable agent runs (F9)
  # docker compose --profile durable up -d  ->  Temporal on 127.0.0.1:17233, UI on :18233.
  # The dev server keeps its state in a SQLite file, so runs survive its restarts too.
  # Then: MIZAN_DURABLE__ENABLED=true for the API, and run `mizan-agent-worker`.
  temporal:
    profiles: [durable]
    restart: unless-stopped
    image: temporalio/temporal:1.8.3
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_TEMPORAL:-17233}:7233"
      - "127.0.0.1:${MIZAN_HOST_PORT_TEMPORAL_UI:-18233}:8233"
    # On the image user's home, so the new volume is owned by that user.
    volumes: [temporal-data:/home/temporal]

  # ---------------------------------------------------------------- observability (F6)
  # docker compose --profile observability up -d   ->  Grafana on http://127.0.0.1:13000
  clickhouse:
    profiles: [observability]
    restart: unless-stopped
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: ${MIZAN_CLICKHOUSE_USER:-mizan}
      CLICKHOUSE_PASSWORD: ${MIZAN_CLICKHOUSE_PASSWORD:-mizan-dev-password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      # The collector creates its tables but not the database.
      CLICKHOUSE_DB: otel
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_CLICKHOUSE:-18123}:8123"
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]

  otel-collector:
    profiles: [observability]
    restart: unless-stopped
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      CLICKHOUSE_USER: ${MIZAN_CLICKHOUSE_USER:-mizan}
      CLICKHOUSE_PASSWORD: ${MIZAN_CLICKHOUSE_PASSWORD:-mizan-dev-password}
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_OTLP_HTTP:-14318}:4318"
    depends_on:
      clickhouse: { condition: service_healthy }

  grafana:
    profiles: [observability]
    restart: unless-stopped
    image: grafana/grafana:11.3.1
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.5.1
      GF_SECURITY_ADMIN_PASSWORD: ${MIZAN_GRAFANA_PASSWORD:-mizan-dev-password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      CLICKHOUSE_USER: ${MIZAN_CLICKHOUSE_USER:-mizan}
      CLICKHOUSE_PASSWORD: ${MIZAN_CLICKHOUSE_PASSWORD:-mizan-dev-password}
      POSTGRES_USER: ${MIZAN_POSTGRES__USER:-mizan}
      POSTGRES_PASSWORD: ${MIZAN_POSTGRES__PASSWORD:-mizan-dev-password}
      POSTGRES_DB: ${MIZAN_POSTGRES__DATABASE:-mizan}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${MIZAN_HOST_PORT_GRAFANA:-13000}:3000"
    depends_on:
      clickhouse: { condition: service_healthy }

volumes:
  clickhouse-data:
  grafana-data:
  postgres-data:
  raw-data:
  # Hugging Face models (~2 GB each): downloaded once, kept across rebuilds.
  model-cache:
  redis-data:
  qdrant-data:
  neo4j-data:
  temporal-data:
